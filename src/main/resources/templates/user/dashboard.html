<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>User Dashboard</h1>
    <p th:text="'Logged in as: ' + ${username}">Logged in as:</p>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>

    <p><a class="button" th:href="@{/user/create-task}">Create Task</a></p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.id}">1</td>
            <td th:text="${task.title}">Title</td>
            <td th:text="${task.description}">Description</td>
            <td th:text="${task.completed ? 'Done' : 'Pending'}">Pending</td>
            <td>
                <form th:unless="${task.completed}"
                      th:action="@{/user/complete/{id}(id=${task.id})}"
                      method="post">
                    <button type="submit">Mark Complete</button>
                </form>
                <span th:if="${task.completed}">-</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tasks)}">
            <td colspan="5">No tasks yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
