<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <nav class="navbar">
        <span class="navbar-brand">Task Manager</span>
        <a href="/user/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </nav>

    <div class="form-card">
        <h2>Create New Task</h2>

        <!-- Posts to /user/create-task in UserController -->
        <form th:action="@{/user/create-task}" method="post">

            <div class="form-group">
                <label for="title">Title</label>
                <!-- name="title" must match @RequestParam String title in controller -->
                <input type="text" id="title" name="title"
                       placeholder="Enter task title..." required class="form-control">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <!-- name="description" must match @RequestParam String description in controller -->
                <textarea id="description" name="description"
                          placeholder="Describe the task..." rows="4" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Create Task</button>
            <a href="/user/dashboard" class="btn btn-secondary" style="margin-left:10px;">Cancel</a>

        </form>
    </div>

</div>

</body>
</html>
