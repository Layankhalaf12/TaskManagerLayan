<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="alert alert-danger text-center p-5 shadow-sm">
        <h1 class="mb-3">Access Denied</h1>
        <p class="mb-4">You do not have permission to view this page.</p>
        <a href="/dashboard" class="btn btn-primary me-2">Back to Dashboard</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </div>
</div>


</body>
</html>
